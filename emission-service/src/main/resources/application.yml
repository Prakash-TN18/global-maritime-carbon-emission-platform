server:
  port: 8083

spring:
  application:
    name: emission-service

  datasource:
    url: jdbc:h2:mem:emissionservice
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}