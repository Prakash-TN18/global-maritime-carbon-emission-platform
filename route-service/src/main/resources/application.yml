server:
  port: 8082
spring:
  application:
    name: route-service
  datasource:
    url: jdbc:h2:mem:routeservice
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}


---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:gmcemp}
    password: ${DB_PASSWORD:gmcemp}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
